name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/pnpm-lock.yaml" ]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
            echo "command=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
            echo "command=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "manager=npm" >> "$GITHUB_OUTPUT"
            echo "command=npm" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: ${{ steps.detect-package-manager.outputs.manager }}
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        # npm 用 ci（严格按 lockfile 安装，CI 标准实践）；pnpm/yarn 走原样 install。
        # fetch 超时/重试：npm 无请求级超时，遇到不可达的 registry 会无限挂起
        # （npm/cli#7657 等），显式配置让挂死的请求快速失败并重试。
        run: |
          if [ "${{ steps.detect-package-manager.outputs.manager }}" = "npm" ]; then
            npm config set fetch-retries 5
            npm config set fetch-retry-mintimeout 15000
            npm config set fetch-retry-maxtimeout 120000
            npm config set fetch-timeout 300000
            npm ci
          else
            ${{ steps.detect-package-manager.outputs.command }} install
          fi
      - name: Build with Astro
        run: |
          ${{ steps.detect-package-manager.outputs.command }} run build \
            --if-present \
            -- --site "${{ steps.pages.outputs.origin }}"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Astro 构建输出目录，模板默认为 Jekyll 的 _site
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
